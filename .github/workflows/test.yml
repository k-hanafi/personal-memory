name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  test:
    name: test
    if: always()
    needs: [pytest, eval-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Require pytest and eval-gate
        run: test "${{ needs.pytest.result }}" = "success" && test "${{ needs.eval-gate.result }}" = "success"

  eval-gate:
    name: eval-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Eval gate
        run: bash scripts/eval-gate.sh
